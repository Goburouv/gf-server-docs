{% extends "base.html" %}

{% block extrahead %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&display=swap">
  <meta name="theme-color" content="#eff0ed" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0f0e" media="(prefers-color-scheme: dark)">
  {% set og_title = config.site_name if page.is_homepage else page.title ~ " · " ~ config.site_name %}
  {% set og_description = page.meta.description if page.meta and page.meta.description else config.site_description %}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ config.site_name }}">
  <meta property="og:title" content="{{ og_title }}">
  <meta property="og:description" content="{{ og_description }}">
  <meta property="og:url" content="{{ page.canonical_url }}">
  <meta property="og:image" content="{{ config.site_url }}assets/social.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ og_title }}">
  <meta name="twitter:description" content="{{ og_description }}">
  <meta name="twitter:image" content="{{ config.site_url }}assets/social.png">
{% endblock %}
